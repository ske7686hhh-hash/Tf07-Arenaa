<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TF07 Arena Premium</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--card2:#efe9e1;--tx:#1b1712;--mut:#7a6f62;--ac:#ff6a00;--ac2:#ffb300;--ok:#17a34a;--bad:#dc2626;--bd:#e3dacd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b10;--card:#15151d;--card2:#1d1d28;--tx:#f4f1ea;--mut:#9a95a6;--bd:#2a2a38}}
:root[data-theme="dark"]{--bg:#0b0b10;--card:#15151d;--card2:#1d1d28;--tx:#f4f1ea;--mut:#9a95a6;--bd:#2a2a38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:900;font-size:20px;letter-spacing:1px}.logo b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--bd)}
.hero{border-radius:20px;padding:20px;background:linear-gradient(135deg,#ff6a00,#c2260c 60%,#4a0d3d);color:#fff;position:relative;overflow:hidden}
.hero small{opacity:.85;font-weight:700;letter-spacing:1px}
.hero h2{font-size:24px;margin:6px 0 4px}
.cd{display:flex;gap:8px;margin:14px 0}
.cd div{flex:1;background:rgba(0,0,0,.3);border-radius:12px;text-align:center;padding:8px 0;font-size:11px}
.cd b{display:block;font-size:22px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),#e8420c);width:100%}
.btn.alt{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{width:auto;padding:8px 12px;font-size:12px}
.btn:disabled{opacity:.5}
.hero .btn{background:#fff;color:#c2260c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:20px;display:block;color:var(--ac)}.stat span{font-size:11px;color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}
.sec h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}
.b.live{background:#dc262622;color:var(--bad)}.b.open{background:#17a34a22;color:var(--ok)}.b.done{background:var(--card2)}
.prize{font-size:22px;font-weight:900;color:var(--ac2)}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.mut{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:15px;margin:5px 0 10px}
label{font-size:12px;font-weight:700;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--bd)}.tbl th{color:var(--mut);font-size:11px}
.rk{font-weight:900;width:30px}.r1{color:#ffb300}.r2{color:#b0b7c3}.r3{color:#cd7f32}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;font-weight:700;padding:6px 0}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:20;display:none}
.room{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px;font-family:ui-monospace,monospace;font-size:14px}
:root{--bg:#07070c;--card:#12121a;--card2:#1b1b27;--tx:#f6f2ea;--mut:#9690a6;--bd:#2a2a3a;--ac:#ff6a00;--ac2:#ffc400}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 300px at 80% -5%,#ff6a0030,transparent),radial-gradient(500px 300px at -10% 100%,#7c1d6f30,transparent);pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.card{background:linear-gradient(160deg,#1a1a26,#10101a);border:1px solid #2d2d40;border-left:3px solid var(--ac);box-shadow:0 8px 24px #0008;animation:fadeup .5s both}
.stat{background:linear-gradient(160deg,#1a1a26,#10101a);border-color:#2d2d40}
.stat b{background:linear-gradient(180deg,#fff0a8,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{background:linear-gradient(135deg,#ff6a00,#b3200a 55%,#2a0a3a);border:1px solid #ffb30066;box-shadow:0 0 40px #ff6a0040,inset 0 0 40px #0004}
.hero h2{font-style:italic;text-transform:uppercase;letter-spacing:1px}
.hero::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);animation:sweep 4s infinite;pointer-events:none}
.btn{background:linear-gradient(90deg,#ff6a00,#ff9d00);color:#1b0a00;box-shadow:0 6px 18px #ff6a0055;text-transform:uppercase;letter-spacing:1px}
.prize{background:linear-gradient(180deg,#fff0a8,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{background:#0c0c14dd;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #ffb30033}
nav button.on{color:var(--ac2);text-shadow:0 0 12px #ff6a00}
.tabs button.on{background:linear-gradient(90deg,#ff6a00,#ffb300);color:#1b0a00;box-shadow:0 0 14px #ff6a0066}
.b.live{animation:blink 1.2s infinite}
.tbl tr:nth-child(2) td{background:#ffb30014}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{left:-60%}60%,100%{left:130%}}
@keyframes blink{50%{opacity:.4}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{to{width:100%}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-100vh) translateX(30px);opacity:0}}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#3a1204 0,#0a0508 60%,#050507 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .7s,transform .7s}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
.emb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.emb i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ff9a2e;box-shadow:0 0 8px #ff6a00;animation:rise linear infinite;opacity:0}
.ring{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
.ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#ff6a00,#ffd000,transparent 40%,#ff6a00);animation:spin 3s linear infinite}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0c0709}
.ring span{position:relative;z-index:1;font-size:40px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#fff2b0,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash h1{font-size:34px;letter-spacing:10px;margin-top:28px;font-weight:900;padding-left:10px;animation:fadeup .9s .5s both}
#splash p{letter-spacing:4px;font-size:11px;color:#ffb36b;margin:6px 0 0;animation:fadeup .9s .8s both}
.load{width:180px;height:3px;background:#ffffff22;border-radius:9px;margin-top:34px;overflow:hidden;transition:opacity .4s}
.load i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6a00,#ffd000);animation:fill 2.1s .2s ease-out forwards}
#splash .enter{position:absolute;bottom:calc(14% + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;border:1px solid #ffb300;background:linear-gradient(90deg,#ff6a00,#ffb300);color:#1b0a00;font-weight:900;letter-spacing:3px;padding:14px 34px;border-radius:99px;font-size:14px;box-shadow:0 0 30px #ff6a0088;transition:opacity .5s}
#splash.ready .enter{opacity:1;pointer-events:auto;animation:pulse 1.4s infinite}
#splash.ready .load{opacity:0}
.ban{margin:-14px -14px 12px;height:112px;border-radius:15px 15px 0 0;overflow:hidden}.ban svg,.ban img{width:100%;height:100%;object-fit:cover;display:block}
.av{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);background:var(--card2);display:grid;place-items:center;font-size:24px;overflow:hidden;padding:0;color:var(--tx);flex:none}
.av img{width:100%;height:100%;object-fit:cover}.av span{line-height:1}.av.on{border-color:var(--ac2);box-shadow:0 0 14px #ff6a0099}
.av.big{width:84px;height:84px;font-size:42px;border:3px solid var(--ac2);box-shadow:0 0 22px #ff6a0077}
.avg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.pf{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.avm{display:flex;gap:8px;align-items:center;background:none;border:0;padding:0}.avm .av{width:38px;height:38px;font-size:20px}
.room b{color:var(--ac2)}
</style>
</head>
<body>
<div id="splash" onclick="enter()"><div class="emb" id="emb"></div><div class="ring"><span>TF07</span></div><h1>ARENA</h1><p>FREE FIRE TOURNAMENTS</p><div class="load"><i></i></div><button class="enter" onclick="enter()">TAP TO ENTER</button></div>
<main id="app"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div id="toast"></div>
<script>
var KEY='tf07premium_v2',H=3600000,D=24*H;
var PTS=[12,9,8,7,6,5,4,3,2,1];
function seed(){var n=Date.now();return{v:'home',f:'all',admin:false,me:{name:'',uid:''},
tours:[
{id:1,name:'Booyah Bash Solo',mode:'Solo',map:'Bermuda',fee:20,prize:2000,max:48,filled:31,at:n+3*H,st:'open',room:'7741920',pass:'BB07'},
{id:2,name:'Squad Surge Cup',mode:'Squad',map:'Purgatory',fee:100,prize:10000,max:12,filled:9,at:n+1*D,st:'open',room:'8820145',pass:'SQ99'},
{id:3,name:'Duo Rush Night',mode:'Duo',map:'Kalahari',fee:50,prize:4000,max:24,filled:24,at:n-10*60000,st:'live',room:'6609312',pass:'DR50'},
{id:4,name:'Free Entry Friday',mode:'Squad',map:'Bermuda',fee:0,prize:1000,max:12,filled:12,at:n-2*D,st:'done',room:'-',pass:'-'}],
regs:[],scores:[]}}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2200)}
function money(n){return n?'₹'+n.toLocaleString('en-IN'):'FREE'}
function fmt(t){return new Date(t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function isReg(id){return S.regs.some(function(r){return r.tid===id})}
function go(v){S.v=v;save();render();window.scrollTo(0,0)}
function board(tid){var m={};S.scores.forEach(function(s){if(tid!=='all'&&s.tid!=tid)return;var k=s.team;m[k]=m[k]||{team:k,k:0,p:0,w:0,m:0};m[k].k+=s.kills;m[k].p+=s.pts;m[k].m++;if(s.place===1)m[k].w++});
return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.p-a.p||b.k-a.k})}
function card(t){var left=t.max-t.filled,reg=isReg(t.id),btn;
if(t.st==='done')btn='<button class="btn alt sm" onclick="S.f='+t.id+';go(\'ranks\')">Results</button>';
else if(reg)btn='<button class="btn alt sm" onclick="room('+t.id+')">View room</button>';
else if(left<=0)btn='<button class="btn sm" disabled>Full</button>';
else btn='<button class="btn sm" onclick="regSheet('+t.id+')">Join · '+(t.fee?'₹'+t.fee:'Free')+'</button>';
return '<div class="card"><div class="row"><h3>'+esc(t.name)+'</h3><span class="b '+t.st+'">'+(t.st==='live'?'● LIVE':t.st==='open'?'OPEN':'ENDED')+'</span></div>'+
'<div class="badges"><span class="b">'+t.mode+'</span><span class="b">'+t.map+'</span><span class="b">'+fmt(t.at)+'</span></div>'+
'<div class="row"><div><div class="mut">PRIZE POOL</div><div class="prize">'+money(t.prize)+'</div></div>'+btn+'</div>'+
'<div class="bar"><i style="width:'+Math.min(100,t.filled/t.max*100)+'%"></i></div><div class="mut">'+t.filled+'/'+t.max+' slots · '+(left>0?left+' left':'full')+'</div></div>'}
function vHome(){var nx=S.tours.filter(function(t){return t.st==='open'}).sort(function(a,b){return a.at-b.at})[0];
return '<div class="top"><div class="logo">TF07 <b>ARENA</b></div><button class="avm" onclick="go(\'me\')"><span class="pill">'+(ON?(S.off?'● OFFLINE':'● ONLINE'):'DEMO')+'</span><span class="av">'+avH()+'</span></button></div>'+
'<div class="hero"><small>NEXT MATCH</small><h2>'+(nx?esc(nx.name):'No match scheduled')+'</h2><div>'+(nx?nx.mode+' · '+nx.map+' · '+money(nx.prize)+' prize':'Check back soon')+'</div>'+
'<div class="cd" id="cd"><div><b>--</b>HRS</div><div><b>--</b>MIN</div><div><b>--</b>SEC</div></div>'+
(nx?'<button class="btn" onclick="'+(isReg(nx.id)?'room('+nx.id+')':'regSheet('+nx.id+')')+'">'+(isReg(nx.id)?'View room details':'Register now')+'</button>':'')+'</div>'+
'<div class="stats"><div class="stat"><b>'+S.tours.length+'</b><span>Tournaments</span></div><div class="stat"><b>'+S.tours.reduce(function(a,t){return a+t.filled},0)+'</b><span>Players</span></div><div class="stat"><b>'+money(S.tours.reduce(function(a,t){return a+t.prize},0))+'</b><span>Prizes</span></div></div>'+
'<div class="sec"><h3>Live &amp; upcoming</h3><span class="mut" onclick="go(\'play\')">See all →</span></div>'+
S.tours.filter(function(t){return t.st!=='done'}).slice(0,2).map(card).join('')}
function vPlay(){var f=S.f==='open'||S.f==='live'||S.f==='done'?S.f:'all',list=S.tours.filter(function(t){return f==='all'||t.st===f});
var tb=[['all','All'],['open','Open'],['live','Live'],['done','Ended']].map(function(x){return '<button class="'+(f===x[0]?'on':'')+'" onclick="S.f=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('');
var mine=S.regs.map(function(r){var t=S.tours.find(function(x){return x.id===r.tid});return t?'<div class="card"><div class="row"><div><b>'+esc(r.team)+'</b><div class="mut">'+esc(t.name)+' · UID '+esc(r.uid)+'</div></div><button class="btn alt sm" onclick="room('+t.id+')">Room</button></div></div>':''}).join('');
return '<div class="top"><div class="logo">TOURNAMENTS</div></div><div class="tabs">'+tb+'</div>'+(S.admin?'<button class="btn" style="margin-bottom:12px" onclick="go(\'me\')">+ Add tournament</button>':'')+(list.map(card).join('')||'<div class="card mut">Nothing here yet.</div>')+
'<div class="sec"><h3>My registrations</h3></div>'+(mine||'<div class="card mut">You haven\'t joined any tournament yet.</div>')}
function vRanks(){var f=S.f==='all'||S.tours.some(function(t){return t.id==S.f})?S.f:'all',b=board(f);
var opts='<option value="all">All tournaments</option>'+S.tours.map(function(t){return '<option value="'+t.id+'"'+(t.id==f?' selected':'')+'>'+esc(t.name)+'</option>'}).join('');
return '<div class="top"><div class="logo">LEADERBOARD</div></div><select onchange="S.f=this.value;render()">'+opts+'</select>'+
(b.length?'<div class="card"><table class="tbl"><tr><th>#</th><th>TEAM</th><th>KILLS</th><th>WINS</th><th>PTS</th></tr>'+b.map(function(r,i){return '<tr><td class="rk r'+(i+1)+'">'+(i+1)+'</td><td>'+esc(r.team)+'</td><td>'+r.k+'</td><td>'+r.w+'</td><td><b>'+r.p+'</b></td></tr>'}).join('')+'</table></div>':'<div class="card mut">No results yet. Scores appear after the admin posts match results.</div>')+
'<div class="card mut">Points: 1st 12 · 2nd 9 · 3rd 8 · 4th 7 · 5th 6 · 6th 5 · 7th 4 · 8th 3 · 9th 2 · 10th 1, plus 1 per kill.</div>'}
function vMe(){var a=S.admin;
var h='<div class="top"><div class="logo">MY PROFILE</div></div><div class="card"><label>In-game name</label><input id="pn" value="'+esc(S.me.name)+'" maxlength="24"><label>Free Fire UID</label><input id="pu" inputmode="numeric" value="'+esc(S.me.uid)+'" maxlength="12"><button class="btn" onclick="saveMe()">Save profile</button></div>';
if(!a)return h+'<div class="card"><h3>Admin panel</h3><p class="mut">Enter admin PIN to manage tournaments and results. Demo PIN: 0707</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn alt" onclick="unlock()">Unlock</button></div>';
return h+'<div class="sec"><h3>Admin · Create tournament</h3><button class="btn alt sm" onclick="S.admin=false;save();render()">Lock</button></div><div class="card"><label>Name</label><input id="an"><label>Mode</label><select id="am"><option>Solo</option><option>Duo</option><option>Squad</option></select><label>Map</label><select id="ap"><option>Bermuda</option><option>Purgatory</option><option>Kalahari</option><option>Alpine</option></select>'+
'<label>Start (hours from now)</label><input id="ah" type="number" value="24"><label>Entry fee ₹</label><input id="af" type="number" value="0"><label>Prize pool ₹</label><input id="ar" type="number" value="1000"><label>Max slots</label><input id="ax" type="number" value="12"><label>Room ID</label><input id="ai"><label>Room password</label><input id="aw"><button class="btn" onclick="addTour()">Create</button></div>'+
'<div class="sec"><h3>Admin · Manage</h3></div>'+S.tours.map(function(t){return '<div class="card"><b>'+esc(t.name)+'</b><div class="mut">'+t.st.toUpperCase()+' · '+t.filled+'/'+t.max+'</div><div class="row" style="margin-top:8px"><button class="btn alt sm" onclick="setSt('+t.id+',\'open\')">Open</button><button class="btn alt sm" onclick="setSt('+t.id+',\'live\')">Live</button><button class="btn alt sm" onclick="setSt('+t.id+',\'done\')">End</button><button class="btn alt sm" onclick="delT('+t.id+')">Delete</button></div></div>'}).join('')+
'<div class="sec"><h3>Admin · Post result</h3></div><div class="card"><label>Tournament</label><select id="st">'+S.tours.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join('')+'</select><label>Team / player name</label><input id="sn"><label>Kills</label><input id="sk" type="number" value="0"><label>Placement (1–12)</label><input id="sp" type="number" value="1"><button class="btn" onclick="addScore()">Add result</button></div>'+
'<div class="sec"><h3>Admin · Registrations ('+S.regs.length+')</h3></div>'+(S.regs.map(function(r){return '<div class="card"><b>'+esc(r.team)+'</b><div class="mut">UID '+esc(r.uid)+' · '+esc(r.contact)+'</div></div>'}).join('')||'<div class="card mut">None yet.</div>')+
'<div class="card mut">Demo only: data stays on this device and the PIN is not secure. Don\'t use real passwords or personal data.</div>'}
function render(){var v=S.v;$('app').innerHTML=v==='home'?vHome():v==='play'?vPlay():v==='ranks'?vRanks():vMe();
